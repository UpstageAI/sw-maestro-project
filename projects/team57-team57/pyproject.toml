[project]
name = "review-ops-agent"
version = "0.1.0"
description = "소상공인 리뷰 응대 AI Agent — LangGraph multi-tenant memory + conditional router + SQL tool"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "langchain-upstage>=0.7.0",
    "openai>=1.50.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
