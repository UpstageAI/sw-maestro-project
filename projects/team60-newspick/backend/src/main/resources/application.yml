spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/newspick}
    username: ${DB_USER:newspick}
    password: ${DB_PASSWORD:newspick}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://*:3000}}

newspick:
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: 120

server:
  port: 8080
